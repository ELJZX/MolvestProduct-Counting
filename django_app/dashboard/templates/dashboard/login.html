{% extends 'dashboard/base.html' %}
{% block title %}Вход в систему{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center">
          <i class="bi bi-box-seam me-1"></i>Учёт продукции
        </h1>
        {% if form.errors %}
          <div class="alert alert-danger py-2">Неверный логин или пароль.</div>
        {% endif %}
        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label" for="id_username">Пользователь</label>
            <input type="text" name="username" id="id_username" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Пароль</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i>Войти
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
