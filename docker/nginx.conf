worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    charset utf-8;

    # Для SSE (StreamingHttpResponse /api/v1/events/)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream django_upstream {
        server django:8000;
    }
    upstream simulator_upstream {
        server simulator:8050;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 100m;

        # --- Статика Django (collectstatic) ---
        location /static/ {
            alias /srv/staticfiles/;
            expires 30d;
            access_log off;
        }
        # --- Медиа (загруженные изображения продуктов) ---
        location /media/ {
            alias /srv/media/;
            expires 30d;
            access_log off;
        }

        # --- Симулятор линии (публикуется в корне как /simulator/) ---
        location = /simulator {
            return 301 /simulator/;
        }
        location /simulator/ {
            proxy_pass http://simulator_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
        }

        # --- API Django + SSE (реальное время) ---
        location /api/v1/events/ {
            proxy_pass http://django_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/ {
            proxy_pass http://django_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # --- Админка Django ---
        location /admin/ {
            proxy_pass http://django_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Всё остальное -> Django ---
        location / {
            proxy_pass http://django_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
